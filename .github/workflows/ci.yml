name: CI

on:
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-molk-rey
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-molk-rey/package-lock.json
      - run: npm ci
      - name: Type Check
        run: npx vue-tsc --noEmit
      - name: Lint
        run: npx eslint . --max-warnings 0
        continue-on-error: false
      - name: Test
        run: npx vitest run --passWithNoTests
